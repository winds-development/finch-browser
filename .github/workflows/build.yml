name: Build Finch Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build libncurses6 libncurses-dev git generate-ninja

      - name: Generate GN Config
        run: |
          # 1. Locate .gn file
          GN_FILE=$(find . -name ".gn" -type f | head -n 1)
          
          if [ -n "$GN_FILE" ]; then
            ROOT_DIR=$(dirname "$GN_FILE")
            echo "Found .gn in $ROOT_DIR"
            cd "$ROOT_DIR"
          fi

          # 2. Locate or install GN binary
          if [ -f "./buildtools/linux64/gn" ]; then
            chmod +x ./buildtools/linux64/gn
            GN_EXEC="./buildtools/linux64/gn"
          else
            GN_EXEC="gn"
          fi

          # 3. Create output dir and generate build files
          mkdir -p out/Default
          $GN_EXEC gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          GN_FILE=$(find . -name ".gn" -type f | head -n 1)
          if [ -n "$GN_FILE" ]; then
            cd $(dirname "$GN_FILE")
          fi
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            **/out/Default/apks/*.apk
            **/out/Default/apks/*.aab
