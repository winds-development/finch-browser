name: 'Any branch: Build APK'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install System Dependencies & GN
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev git curl gn

      - name: Setup Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fresh Clone Kiwi Source
        run: |
          # Purana khali ya invalid src folder clean karo
          rm -rf src
          # Pure source tree ko clone karo
          git clone --depth 1 https://github.com/kiwibrowser/src.next.git src
          
          # Verification check
          if [ -f "src/.gn" ]; then
            echo ".gn file found successfully in src!"
          else
            echo "ERROR: .gn still missing after clone!"
            exit 1
          fi

      - name: Generate Build Configurations
        run: |
          cd src
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          cd src
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            src/out/Default/apks/*.apk
            src/out/Default/apks/*.aab
