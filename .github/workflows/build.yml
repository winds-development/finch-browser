name: Build Finch Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build libncurses6 libncurses-dev git generate-ninja

      - name: Generate GN Config
        run: |
          # System GN ya repo executable use karenge
          if [ -f "./buildtools/linux64/gn" ]; then
            chmod +x ./buildtools/linux64/gn
            ./buildtools/linux64/gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'
          else
            gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'
          fi

      - name: Compile Finch APK
        run: |
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            **/out/Default/apks/*.apk
            **/out/Default/apks/*.aab
