name: Build Finch Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev git

      - name: Setup Depot Tools & Generate GN
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          
          # Initialize Python bin path inside depot_tools
          python3 $HOME/depot_tools/update_depot_tools.py || true

          # Find exact GN executable in repo or runner
          GN_BIN=""
          if [ -f "./buildtools/linux64/gn" ]; then
            chmod +x ./buildtools/linux64/gn
            GN_BIN="./buildtools/linux64/gn"
          else
            GN_BIN="gn"
          fi

          mkdir -p out/Default
          $GN_BIN gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            **/out/Default/apks/*.apk
            **/out/Default/apks/*.aab
