name: 'Any branch: Build APK'

on:
  pull_request:
    branches:
      - main
      - kiwi
  workflow_dispatch:

concurrency: build_test_apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Depot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev git curl
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch Full Source Code
        run: |
          git clone --depth 1 https://github.com/kiwibrowser/src.next.git src

      - name: Generate Build Configurations
        run: |
          cd src
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          cd src
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            src/out/Default/apks/*.apk
            src/out/Default/apks/*.aab
