name: Build Finch Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Dependencies & Depot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev git
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Prepare Directory and Generate Config
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          GN_PATH=$(find . -name "gn" -type f | head -n 1)
          if [ -n "$GN_PATH" ]; then
            chmod +x "$GN_PATH"
            "$GN_PATH" gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'
          else
            gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'
          fi

      - name: Compile Finch APK
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            **/out/Default/apks/*.apk
            **/out/Default/apks/*.aab
