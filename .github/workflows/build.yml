name: Build Finch Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install & Initialize Depot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev git
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          export PATH="$HOME/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          # Depot tools ko initialize kar rahe hain
          python3 $HOME/depot_tools/ensure_bootstrap.py || true

      - name: Generate GN Config
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          # Root directory locate karo
          GN_BIN=$(which gn || find . -name "gn" -type f | head -n 1)
          if [ -z "$GN_BIN" ]; then
            GN_BIN="gn"
          fi
          
          # Run GN gen directly with root parameter if needed
          $GN_BIN gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false' --root=. || $GN_BIN gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            **/out/Default/apks/*.apk
            **/out/Default/apks/*.aab
