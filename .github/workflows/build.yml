name: 'Any branch: Build APK'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install System Build Tools & Native GN
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev git curl gn

      - name: Clone Kiwi Source Tree
        run: |
          rm -rf kiwi_src
          git clone --depth 1 https://github.com/kiwibrowser/src.next.git kiwi_src

      - name: Generate GN Build Config (Using System GN)
        run: |
          cd kiwi_src
          
          # Create root .gn if missing
          if [ ! -f ".gn" ]; then
            echo 'buildconfig = "//build/config/BUILDCONFIG.gn"' > .gn
          fi

          # Disable depot tools auto-update environment check
          export DEPOT_TOOLS_UPDATE=0
          
          # Force call System GN binary directly (/usr/bin/gn)
          /usr/bin/gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          cd kiwi_src
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            kiwi_src/out/Default/apks/*.apk
            kiwi_src/out/Default/apks/*.aab
