name: Build Finch Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev generate-ninja

      - name: Locate and Generate GN Build
        run: |
          GN_BIN=$(which gn || find . -name "gn" -type f | head -n 1)
          if [ -z "$GN_BIN" ]; then
            sudo apt-get install -y generate-ninja
            GN_BIN="gn"
          fi
          SRC_DIR=$(dirname $(find . -maxdepth 3 -name ".gn" | head -n 1))
          cd "$SRC_DIR"
          $GN_BIN gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          SRC_DIR=$(dirname $(find . -maxdepth 3 -name ".gn" | head -n 1))
          cd "$SRC_DIR"
          ninja -C out/Default chrome_public_apk || ninja -C out/Default chrome_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            **/out/Default/apks/*.apk
            **/out/Default/apks/*.aab
