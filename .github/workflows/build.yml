name: 'Any branch: Build APK'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev git curl

      - name: Setup Depot Tools & Bootstrap
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          
          # Initialize depot tools properly
          python3 $HOME/depot_tools/ensure_bootstrap.py || true

      - name: Fetch Official Source Code
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          # Clone Kiwi source directly into 'src'
          git clone --depth 1 https://github.com/kiwibrowser/src.next.git src

      - name: Generate Build Configurations
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd src
          
          # Run ensure_bootstrap again if required by depot_tools
          python3 $HOME/depot_tools/ensure_bootstrap.py || true
          
          # Generate GN config
          $HOME/depot_tools/gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false' || gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd src
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            src/out/Default/apks/*.apk
            src/out/Default/apks/*.aab
