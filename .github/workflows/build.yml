name: Build Finch Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install System Dependencies & Depot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev git
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch Official Source Code (gclient sync)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          # Create .gclient configuration for Kiwi/Chromium source
          gclient config --spec 'solutions = [{ "name": "src", "url": "https://github.com/kiwibrowser/src.next.git", "managed": False, "custom_deps": {}, },]'
          gclient sync --no-history --shallow

      - name: Generate Build Configurations
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd src
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd src
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            src/out/Default/apks/*.apk
            src/out/Default/apks/*.aab
