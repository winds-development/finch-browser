name: Build Finch Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build libncurses6 libncurses-dev generate-ninja

      - name: Prepare Directory and Generate Config
        run: |
          # Agar src folder hai to wahan jao, nahi to root me hi .gn dhoondo
          if [ -d "src" ]; then cd src; fi
          mkdir -p out/Default
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false' || python3 tools/gn/bootstrap/bootstrap.py --gn-gen-args='target_os="android" target_cpu="arm64" is_debug=false'

      - name: Compile Finch APK
        run: |
          if [ -d "src" ]; then cd src; fi
          ninja -C out/Default chrome_public_apk

      - name: Upload Finch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finch-Browser-APK
          path: |
            **/out/Default/apks/*.apk
            **/out/Default/apks/*.aab
